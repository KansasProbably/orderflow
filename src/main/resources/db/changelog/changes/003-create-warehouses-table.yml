databaseChangeLog:
  - changeSet:
      id: create-warehouse-table
      author: kolyan
      changes:
        - createTable:
            tableName: warehouses
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: code
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: warehouses
            columnNames: code
            constraintName: uk_warehouse_code