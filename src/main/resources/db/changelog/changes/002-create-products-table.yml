databaseChangeLog:
  - changeSet:
      id: create-product-table
      author: kolyan
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: sku
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: product_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: products
            columnNames: sku
            constraintName: uk_product_sku

        - sql:
            sql:
              ALTER TABLE products
              ADD CONSTRAINT ck_product_price_positive
              CHECK (price > 0);
