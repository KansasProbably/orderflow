databaseChangeLog:
  - changeSet:
      id: create-order-item-table
      author: kolyan
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: warehouse_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_item_order
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_order_item_product
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: warehouse_id
            referencedTableName: warehouses
            referencedColumnNames: id
            constraintName: fk_order_items_warehouse
            onDelete: RESTRICT

        - addUniqueConstraint:
            tableName: order_items
            columnNames: order_id, product_id, warehouse_id
            constraintName: uk_order_item_order_product_warehouse

        - sql:
            sql: |
              ALTER TABLE order_items
              ADD CONSTRAINT ck_order_item_quantity_positive
              CHECK (quantity > 0);

        - sql:
            sql: |
              ALTER TABLE order_items
              ADD CONSTRAINT ck_order_item_price_positive
              CHECK (price > 0);