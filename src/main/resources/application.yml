spring:
  application:
    name: orderflow

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

