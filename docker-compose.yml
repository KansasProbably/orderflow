services:

  grafana:
    image: grafana/grafana:13.3.1
    container_name: orderflow-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: orderflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  kafka:
    image: apache/kafka:4.3.1
    container_name: orderflow-kafka
    ports:
      - "9092:9092"

  postgres:
    image: postgres:16
    container_name: orderflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - orderflow-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: orderflow-redis
    ports:
      - "6379:6379"

volumes:
  orderflow-postgres-data:
  grafana-data: